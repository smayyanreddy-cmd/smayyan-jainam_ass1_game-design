ss<!doctype html>
<html lang="en" data-theme="neon">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F17" />
  <title>PedalPace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9A%B4%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- The map lives under every screen -->
    <div id="map" aria-label="Territory map" role="application"></div>

    <!-- ===== Map HUD (home) ===== -->
    <header class="topbar" id="topbar">
      <div class="chip chip-points" title="Total points"><span class="chip-ico" aria-hidden="true">★</span><b id="tb-points">0</b><span class="sr">points</span></div>
      <div class="chip chip-streak" title="Streak"><span class="chip-ico" aria-hidden="true">🔥</span><b id="tb-streak">0</b><span class="sr">day streak</span></div>
      <button class="daily" id="tb-daily" aria-label="Daily minimum progress">
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="tb-ring"/></svg>
        <span id="tb-daily-txt">0%</span>
      </button>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-sun" aria-pressed="false" aria-label="Sunlight mode (high contrast)" title="Sunlight mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
      <button class="icon-btn" id="btn-bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
        <span class="badge" id="bell-badge" hidden>0</span>
      </button>
    </header>

    <div class="map-tools" id="map-tools">
      <button class="icon-btn" id="btn-locate" aria-label="Centre on home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="icon-btn" id="btn-legend" aria-label="Map legend" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    </div>
    <div class="legend panel" id="legend" hidden></div>

    <!-- ===== Bottom navigation ===== -->
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Main">
      <button role="tab" data-tab="map" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg><span>Map</span></button>
      <button role="tab" data-tab="ranks" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg><span>Ranks</span></button>
      <button class="fab" id="btn-start" aria-label="Start activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg><span>GO</span></button>
      <button role="tab" data-tab="clan" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M15 20a4.5 4.5 0 0 1 7-3.7"/></svg><span>Clan</span></button>
      <button role="tab" data-tab="profile" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></button>
    </nav>

    <!-- ===== Start sheet ===== -->
    <section class="sheet" id="sheet-start" hidden aria-labelledby="start-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="start-title">Start an activity</h2>
        <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="muted small">Prototype: pick a simulated GPS route. No need to go outside.</p>
      <div class="scenario-list" id="scenario-list"></div>
      <div class="opt-row">
        <span class="opt-label" id="lbl-mode">Mode</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-mode" id="opt-mode">
          <button role="radio" data-v="auto">Auto</button><button role="radio" data-v="walk">🚶 Walk</button><button role="radio" data-v="cycle">🚴 Cycle</button>
        </div>
      </div>
      <p class="hint small" id="mode-hint"></p>
      <div class="opt-row">
        <span class="opt-label" id="lbl-group">Moving with</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-group" id="opt-group">
          <button role="radio" data-v="1">Solo</button><button role="radio" data-v="2">+1 mate</button><button role="radio" data-v="3">+2 mates</button>
        </div>
      </div>
      <div class="opt-row">
        <span class="opt-label" id="lbl-speed">Sim speed</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-speed" id="opt-speed">
          <button role="radio" data-v="5">×5</button><button role="radio" data-v="20">×20</button><button role="radio" data-v="60">×60</button>
        </div>
      </div>
      <label class="switch-row"><span>Heart-rate monitor (simulated)</span><input type="checkbox" id="opt-hr" /><i aria-hidden="true"></i></label>
      <button class="btn btn-primary btn-block" id="btn-go">Start</button>
    </section>

    <!-- ===== Draw-your-route bar ===== -->
    <section class="drawbar panel" id="drawbar" hidden>
      <b>Tap the map to add waypoints</b>
      <p class="small muted"><span id="draw-count">0</span> points · <span id="draw-km">0.00</span> km</p>
      <div class="opt-row">
        <label for="draw-speed" class="opt-label">Speed <b id="draw-speed-v">5.5</b> km/h</label>
        <input type="range" id="draw-speed" min="3" max="40" step="0.5" value="5.5" />
      </div>
      <div class="row gap">
        <button class="btn" id="draw-undo">Undo</button>
        <button class="btn" id="draw-cancel">Cancel</button>
        <button class="btn btn-primary" id="draw-go" disabled>Ride it</button>
      </div>
    </section>

    <!-- ===== Recording HUD ===== -->
    <section class="rec" id="rec" hidden aria-label="Recording">
      <div class="rec-top panel">
        <div class="rec-flag" id="rec-flag" role="alert" hidden></div>
        <div class="rec-main">
          <div>
            <div class="lbl">Damage</div>
            <div class="big" id="r-damage">0</div>
          </div>
          <div class="rec-ctx" id="r-ctx">Free roam</div>
        </div>
        <div class="rec-stats">
          <div><span class="lbl">Distance</span><b id="r-dist">0.00</b><small>km</small></div>
          <div><span class="lbl">Time</span><b id="r-time">0:00</b></div>
          <div><span class="lbl">Speed</span><b id="r-speed">0.0</b><small>km/h</small></div>
          <div><span class="lbl">Points</span><b id="r-points">0</b></div>
        </div>
        <div class="rec-chips" id="r-chips"></div>
        <div class="daily-bar" aria-label="Daily minimum"><i id="r-daily-fill"></i><span id="r-daily-txt">Daily minimum 0%</span></div>
      </div>
      <div class="rec-banner" id="rec-banner" aria-live="assertive"></div>
      <div class="rec-bottom">
        <button class="btn btn-round" id="r-pause" aria-label="Pause">❚❚</button>
        <button class="btn" id="r-speedbtn" aria-label="Change simulation speed">×20</button>
        <button class="btn btn-danger" id="r-finish">Finish</button>
      </div>
    </section>

    <!-- ===== Full screens ===== -->
    <section class="screen" id="screen-summary" hidden aria-labelledby="sum-title"></section>
    <section class="screen" id="screen-ranks" hidden aria-labelledby="ranks-title"></section>
    <section class="screen" id="screen-clan" hidden aria-labelledby="clan-title"></section>
    <section class="screen" id="screen-profile" hidden aria-labelledby="prof-title"></section>
    <section class="screen" id="screen-onboarding" hidden aria-label="Welcome"></section>

    <!-- ===== Notifications drawer ===== -->
    <section class="drawer panel" id="drawer-notifs" hidden aria-labelledby="notif-title">
      <div class="sheet-head">
        <h2 id="notif-title">Notifications</h2>
        <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <ul class="notif-list" id="notif-list"></ul>
    </section>

    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
